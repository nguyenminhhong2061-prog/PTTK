events {
    worker_connections 1024;
}

http {
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    upstream exam_service {
        server exam-service:8080;
    }
    upstream submission_service {
        server submission-service:8080;
    }
    upstream statistics_service {
        server statistics-service:8080;
    }

    server {
        listen 80;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        location = /api/exams {
            proxy_pass http://exam_service/exams;
        }

        location /api/questions/ {
            proxy_pass http://exam_service/questions/;
        }

        location /api/exams/ {
            proxy_pass http://exam_service/exams/;
        }

        location = /api/submissions {
            proxy_pass http://submission_service/submissions;
        }

        location /api/submissions/ {
            proxy_pass http://submission_service/submissions/;
        }

        location /api/statistics/ {
            proxy_pass http://statistics_service/statistics/;
        }

        location /health {
            default_type application/json;
            return 200 '{"status":"ok","service":"api-gateway-baseline"}';
        }
    }
}
