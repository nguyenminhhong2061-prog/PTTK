# =====================================================
# Nginx API Gateway Configuration
# Routing: Frontend/Client -> Gateway -> Backend Services
# =====================================================

events {
    worker_connections 1024;
}

http {
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Protect the grading workflow from sudden submit spikes. The key is the
    # real client IP as seen by this gateway.
    limit_req_zone $binary_remote_addr zone=submit_limit:10m rate=10r/s;

    upstream exam_service {
        server exam-service:8080;
    }
    upstream submission_service {
        server submission-service:8080;
    }
    upstream statistics_service {
        server statistics-service:8080;
    }

    server {
        listen 80;

        error_page 429 = @rate_limited;
        error_page 502 = @bad_gateway;
        error_page 504 = @gateway_timeout;

        add_header 'Access-Control-Allow-Origin'  '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        location = /api/questions {
            proxy_pass         http://exam_service/questions;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        location /api/questions/ {
            proxy_pass         http://exam_service/questions/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        # Avoid Nginx's automatic trailing-slash redirect for the collection
        # URL.  A redirect generated with `$host` loses the non-default
        # Gateway port and breaks load-test clients using localhost:8080.
        location = /api/exams {
            proxy_pass         http://exam_service/exams;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        location /api/exams/ {
            proxy_pass         http://exam_service/exams/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        # This URI currently only supports POST. Do not enable
        # proxy_next_upstream non_idempotent: a timed-out submit may already
        # have committed in Submission Service.
        location ~ ^/api/submissions/[^/]+/submit$ {
            limit_req        zone=submit_limit burst=20 nodelay;
            limit_req_status 429;

            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass       http://submission_service;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_send_timeout    10s;
            proxy_read_timeout    10s;
            proxy_next_upstream   off;
            proxy_intercept_errors on;
        }

        location = /api/submissions {
            proxy_pass         http://submission_service/submissions;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        location /api/submissions/ {
            proxy_pass         http://submission_service/submissions/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        location /api/statistics/ {
            proxy_pass         http://statistics_service/statistics/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        location /health {
            return 200 '{"status":"ok","service":"api-gateway"}';
            add_header Content-Type application/json;
        }

        location @rate_limited {
            default_type application/json;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
            add_header Retry-After 1 always;
            return 429 '{"success":false,"error":"RATE_LIMIT_EXCEEDED","message":"Too many requests. Please retry later."}';
        }

        location @bad_gateway {
            default_type application/json;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
            return 502 '{"success":false,"error":"BAD_GATEWAY","message":"Upstream service is unavailable."}';
        }

        location @gateway_timeout {
            default_type application/json;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
            return 504 '{"success":false,"error":"GATEWAY_TIMEOUT","message":"Upstream service did not respond in time."}';
        }

        location / {
            return 404 '{"error":"NOT_FOUND","message":"Route not found"}';
            add_header Content-Type application/json;
        }
    }
}
