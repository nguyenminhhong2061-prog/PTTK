server.port=8080

# MySQL is used only for persistent consumer idempotency state. Statistics
# REST endpoints continue to derive their reports from Submission Service.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:statistics_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# RabbitMQ topology shared with the Submission Outbox publisher.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASS:changeme}
spring.rabbitmq.connection-timeout=5000
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false

app.rabbitmq.exchange=${RABBITMQ_EXCHANGE:quiz.events}
app.rabbitmq.queue=${RABBITMQ_QUEUE:statistics.exam-submitted}
app.rabbitmq.routing-key=${RABBITMQ_ROUTING_KEY:exam.submitted}
app.rabbitmq.dlq=${RABBITMQ_DLQ:statistics.exam-submitted.dlq}

# Submission Service URL
submission.service.url=${SUBMISSION_SERVICE_URL:http://submission-service:8080}

# Actuator health endpoint
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.health=health
management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health

# Logging
logging.level.com.quizapp=INFO
logging.level.org.springframework.web=WARN
