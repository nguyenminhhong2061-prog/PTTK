server.port=8080

# URL Submission Service (inject từ docker-compose environment)
submission.service.url=${SUBMISSION_SERVICE_URL:http://submission-service:8080}

# Actuator — map /health
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.health=health
management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health

# Logging
logging.level.com.quizapp=INFO
logging.level.org.springframework.web=WARN

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASS:changeme}
spring.rabbitmq.connection-timeout=5000
spring.rabbitmq.listener.simple.acknowledge-mode=auto